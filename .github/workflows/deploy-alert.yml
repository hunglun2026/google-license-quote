name: deploy alert worker

# 匯率警示 Worker（每 5 分鐘檢查第一銀行美金牌價）：push main 且動到相關檔案就自動部署，先跑測試。
# Actions secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（hunglun2026）。
# Worker 執行期機密（NTFY_TOPIC、ALERT_EMAIL）另外用 deploy/set-ntfy-topic.ps1 設定。
on:
  push:
    branches: [main]
    paths:
      - 'alert/**'
      - 'functions/_lib/**'
      - 'test/alert.test.mjs'
      - '.github/workflows/deploy-alert.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 警示邏輯測試
        run: node test/alert.test.mjs
      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: alert
          command: deploy
